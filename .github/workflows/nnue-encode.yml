name: NNUE cloud encode

# Manual only -- this is a one-off (or occasional) heavy CPU job to encode
# selfplay-data.jsonl into NNUE input features, offloaded here because doing
# it locally (os.cpus().length - 1 worker_threads, each loading the full
# engine-merged.js and running evaluateStateComponents per position) pegged
# the owner's machine hard enough to be unusable (2026-09-17 incident).
# Training itself stays local (cheap, minutes, and the owner wants to iterate
# on hyperparameters without a cloud round-trip each time) -- only the
# expensive encode step runs here. See nnue/README-cloud-encode.md (if it
# exists) or this workflow's own steps for how to consume the output.
on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: "Path (within gha-segments-16cards) to the gzipped dataset to encode"
        required: false
        default: "datasets/round1-full-218007.jsonl.gz"

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Fetch dataset from gha-segments-16cards
        run: |
          git fetch --depth=1 origin gha-segments-16cards
          git show "origin/gha-segments-16cards:${{ github.event.inputs.dataset_path }}" > selfplay-data.jsonl.gz
          gunzip -f selfplay-data.jsonl.gz
          wc -l selfplay-data.jsonl

      - name: Pin encode.js mtime
        # train.js's on-disk encode cache is keyed on sha1(dataFile content) +
        # encode.js's OWN mtime (so an encode.js edit invalidates stale
        # caches). git checkout sets mtimes to checkout time, which won't
        # match whatever the owner's local encode.js mtime happens to be --
        # pinning both sides to this same fixed timestamp (see the matching
        # `touch` the owner runs locally before copying this job's cache
        # output into nnue/cache/) makes the cache key line up so the local
        # `node train.js` run picks this up as a hit instead of re-encoding.
        run: touch -d "2026-01-01T00:00:00Z" nnue/encode.js

      - name: Encode (no TF training here, just the cached feature build)
        env:
          # os.cpus().length - 1 would compute 1 on this runner's 2 cores
          # (see train.js's own comment) -- use both.
          ENCODE_WORKER_COUNT: "2"
        run: |
          cd nnue
          node -e "
            require('./train.js').loadData().then((d) => {
              console.log('encoded', d.inputs.length, 'positions,', d.gameIds.length ? d.gameIds[d.gameIds.length-1]+1 : 0, 'games');
            }).catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Upload encode cache (artifact, convenience backup)
        uses: actions/upload-artifact@v4
        with:
          name: nnue-encode-cache
          path: nnue/cache/
          retention-days: 14

      - name: Push encode cache to gha-segments-16cards
        # Actions artifacts need an authenticated download (works fine from
        # a browser, but not from a plain unauthenticated `git`/API call),
        # so this pushes the same files to the data branch too -- a public
        # git read is all that's needed to pull them back down from there,
        # same as the self-play checkpoints already do.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Default bash runs with -e -- the `[ -f "$f" ] && ...` guards below
        # are meant to no-op harmlessly if a glob doesn't match, but -e
        # would abort the whole step on that "failed" test instead (same
        # gotcha already hit and fixed in selfplay.yml). Drop -e, keep -u/
        # pipefail for real bugs.
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          mkdir -p /tmp/cachestage
          cd nnue/cache
          for f in *.bin; do [ -f "$f" ] && gzip -c "$f" > "/tmp/cachestage/${f}.gz"; done
          for f in *.meta.json; do [ -f "$f" ] && cp "$f" "/tmp/cachestage/$f"; done
          cd "$GITHUB_WORKSPACE"

          rm -rf /tmp/cwt
          git fetch origin gha-segments-16cards
          git worktree add -B gha-segments-16cards /tmp/cwt origin/gha-segments-16cards
          mkdir -p /tmp/cwt/nnue-cache
          cp /tmp/cachestage/* /tmp/cwt/nnue-cache/

          cd /tmp/cwt
          git config user.email "actions@github.com"
          git config user.name "gha-selfplay-bot"
          git add nnue-cache/
          if git diff --cached --quiet; then
            echo "nothing new to push"
          else
            git commit -q -m "nnue encode cache from run ${{ github.run_id }}"
            for i in 1 2 3; do
              git fetch origin gha-segments-16cards -q
              git rebase origin/gha-segments-16cards -q && break
              git rebase --abort 2>/dev/null
              sleep 5
            done
            git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gha-segments-16cards
          fi
